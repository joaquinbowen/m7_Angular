<div class="container row ">
    @for (item of sucursales; track $index) {
    <div class="card my-3 col mx-3">
        <div class=" card-header my-3 ">
            <h2>{{item.name}}</h2>
        </div>
        <div>
            <table class="table table-striped table-bordered">
                <thead class="table-info">
                    <tr>
                        <th>Nombre</th>
                        <th>Stock</th>
                        <th>Categoria</th>
                    </tr>

                </thead>
                <tbody>
                    @for (producto of item.productos;track $index) {
                    <tr>
                        <td>{{producto.name}} </td>
                        <td>{{producto.stock}} </td>
                        <td>{{producto.categoria.name}} </td>
                    </tr>

                    }

                </tbody>
            </table>
        </div>
    </div>
    }

</div>
<div class="container mt-4">
    <div class="card">
        <div class="card-body text-center">
            <h3 class="card-title">Stock Total</h3>
            <p class="display-4 text-primary">{{ stockTotal }}</p>
            <small class="text-muted">Unidades en todas las sucursales</small>
        </div>
    </div>
</div>
