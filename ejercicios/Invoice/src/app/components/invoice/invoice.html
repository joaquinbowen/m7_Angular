<div class="container">
    <div class="card my-5">
        <div class="card-header bg-primary text-white">
            <h2>FACTURA</h2>
        </div>
        <div class="card-body">
            <div>
                <ul class="list-group mb-3">
                    <li class="list-group-item"><strong>No.</strong> {{invoice.id}}</li>
                </ul>
            </div>
            <div class="row">
                <div class="col">
                    <app-company-view [company]="invoice.company"></app-company-view>
                </div>
                <div class="col">
                    <app-customer-view [customer]="invoice.customer"></app-customer-view>
                </div>
            </div>

            <div class="my-3">
                <app-invoice-detail-view [items]="invoice.items"></app-invoice-detail-view>
            </div>
        </div>
    </div>
</div>
